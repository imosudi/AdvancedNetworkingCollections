!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname RouterEight
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
ip auth-proxy max-nodata-conns 3
ip admission max-nodata-conns 3
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
! 
!
!
!
!
interface Loopback0
 description Router ID and iBGP source
 ip address 10.211.0.8 255.255.255.255
!
interface FastEthernet0/0
 description Link to R3 (L9)
 ip address 10.111.0.30 255.255.255.252
 ip ospf network point-to-point
 duplex auto
 speed auto
!
interface FastEthernet0/1
 description Server LAN gateway
 ip address 172.27.20.1 255.255.255.0
 duplex auto
 speed auto
!
router ospf 1
 router-id 10.211.0.8
 log-adjacency-changes
 passive-interface FastEthernet0/1
 network 10.111.0.28 0.0.0.3 area 0
 network 10.211.0.8 0.0.0.0 area 0
 network 172.27.20.0 0.0.0.255 area 2
!
router bgp 65500
 no synchronization
 bgp router-id 10.211.0.8
 bgp log-neighbor-changes
 network 172.27.20.0 mask 255.255.255.0
 neighbor 10.211.0.7 remote-as 65500
 neighbor 10.211.0.7 update-source Loopback0
 no auto-summary
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
no cdp log mismatch duplex
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
